# One-click hosting on Render (render.com): New > Blueprint, pick this repo.
# It builds the game and runs the multiplayer and save server on one free web service.
services:
  - type: web
    name: eko-streets
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      # Saved games: a Postgres connection string (Supabase's session
      # pooler, or Neon). Render asks for it; leave it empty to save to a file that
      # is wiped on each restart.
      - key: DATABASE_URL
        sync: false
